{{define "content"}}<div class="page-head"><p class="eyebrow">Configuration</p><h1>Add customer site</h1><p>Organize recorders by customer and physical location.</p></div><form class="panel form" action="/sites" method="post"><div class="two"><label>Customer name<input required name="customer" value="{{.Site.Customer}}" placeholder="Acme Logistics"></label><label>Site name<input required name="name" value="{{.Site.Name}}" placeholder="Amsterdam warehouse"></label></div><label>Address<textarea name="address" rows="2" placeholder="Street, city, country">{{.Site.Address}}</textarea></label><div class="two"><label>Timezone<input required name="timezone" value="{{.Site.Timezone}}" placeholder="Europe/Amsterdam"></label><label>Default export folder<input name="destination" value="{{.Site.Destination}}" placeholder="acme/amsterdam"><small>Relative to the configured export root.</small></label></div><div class="actions"><a href="/">Cancel</a><button class="primary">Save and add recorder</button></div></form>{{end}}
