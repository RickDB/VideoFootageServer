{{define "content"}}<div class="page-head"><p class="eyebrow">Site-wide appearance</p><h1>Theme</h1><p>The selected theme is applied to every page, including login.</p></div><form class="panel form" action="/settings/theme" method="post"><div class="theme-options"><label><input type="radio" name="theme" value="kfc" {{if eqs .Theme "kfc"}}checked{{end}}><span class="theme-preview kfc-preview"><b>Red & white</b><small>Default, KFC-inspired operations theme</small></span></label><label><input type="radio" name="theme" value="classic" {{if eqs .Theme "classic"}}checked{{end}}><span class="theme-preview classic-preview"><b>Classic teal</b><small>Original evidence console palette</small></span></label><label><input type="radio" name="theme" value="charcoal" {{if eqs .Theme "charcoal"}}checked{{end}}><span class="theme-preview charcoal-preview"><b>Charcoal</b><small>Low-light control room palette</small></span></label></div><div class="actions"><a href="/">Cancel</a><button class="primary" type="submit">Apply theme</button></div></form>{{end}}
