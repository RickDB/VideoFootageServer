{{define "content"}}<div class="page-head"><p class="eyebrow">Footage request</p><h1>Request footage</h1><p>Times are the recorder's own local time at the site — not your browser's timezone.</p></div>
<form class="panel form" action="/requests" method="post" id="request-form"><label>Site<select required name="site_id" id="site-select"><option value="">Choose a site</option>{{range .Sites}}<option value="{{.ID}}" data-timezone="{{.Timezone}}">{{.Customer}} · {{.Name}}</option>{{end}}</select><small id="tz-note"></small></label>
<div id="camera-picker" class="cam-picker-panel"><p class="muted">Choose a site to see its cameras.</p></div>
<fieldset><legend>Date &amp; time</legend><p class="hint">Add more than one range if the footage you need spans separate moments.</p><div id="slots" class="slots"></div><button type="button" id="add-slot" class="secondary small">+ Add another time range</button></fieldset>
<div class="two"><label>Reference / incident number<input name="reference" placeholder="Optional"></label><label>Category<select name="category"><option value="">Choose one</option><option value="theft">Theft</option><option value="incident">Incident</option><option value="dispute">Customer dispute</option><option value="other">Other</option></select></label></div>
<label>Comments<textarea name="comments" rows="2" placeholder="Anything that helps us locate the right footage"></textarea></label>
<input type="hidden" name="cameras_json" id="cameras-json">
<input type="hidden" name="slots_json" id="slots-json">
<div class="actions"><a href="/requests">Cancel</a><button class="primary" type="submit">Submit request</button></div></form>
<script>const siteSelect=document.querySelector('#site-select'),picker=document.querySelector('#camera-picker'),tzNote=document.querySelector('#tz-note'),slotsRoot=document.querySelector('#slots');
let pickerCtrl=null;
async function loadCameras(){const id=siteSelect.value;const opt=siteSelect.selectedOptions[0];tzNote.textContent=opt&&opt.dataset.timezone?`Recorder timezone: ${opt.dataset.timezone}`:'';pickerCtrl=null;if(!id){picker.innerHTML='<p class="muted">Choose a site to see its cameras.</p>';return}
picker.innerHTML='<p class="muted">Loading cameras…</p>';
try{const r=await fetch(`/api/sites/${id}/cameras`);const cams=await r.json();if(!Array.isArray(cams)||cams.length===0){picker.innerHTML='<p class="muted">No cameras are configured for this site yet.</p>';return}
pickerCtrl=HF.cameraPicker(picker,cams,{key:c=>String(c.id),thumbId:c=>c.id,title:c=>c.name})}catch(e){picker.innerHTML='<p class="muted">Could not load cameras for this site.</p>'}}
siteSelect.addEventListener('change',loadCameras);
function updateSlotButtons(){const rows=[...slotsRoot.querySelectorAll('.slot-row')];rows.forEach(row=>{row.querySelector('.slot-remove').hidden=rows.length<2})}
function addSlot(vals){vals=vals||{};const row=document.createElement('div');row.className='slot-row';row.innerHTML=`<label>Date<input required type="date" class="slot-date" value="${vals.date||''}"></label><label>Start time<input required type="time" class="slot-start" value="${vals.start||''}"></label><label>End time<input required type="time" class="slot-end" value="${vals.end||''}"></label><button type="button" class="tiny slot-remove" aria-label="Remove this time range">✕</button>`;row.querySelector('.slot-remove').onclick=()=>{row.remove();updateSlotButtons()};slotsRoot.appendChild(row);updateSlotButtons()}
document.querySelector('#add-slot').onclick=()=>addSlot();
addSlot();
document.querySelector('#request-form').addEventListener('submit',e=>{const chosen=pickerCtrl?pickerCtrl.selected().map(c=>({id:c.id,channel_id:c.channel_id,name:c.name})):[];if(chosen.length===0){e.preventDefault();alert('Choose at least one camera.');return}
const slots=[...slotsRoot.querySelectorAll('.slot-row')].map(row=>({date:row.querySelector('.slot-date').value,start:row.querySelector('.slot-start').value,end:row.querySelector('.slot-end').value}));
if(!slots.length||slots.some(s=>!s.date||!s.start||!s.end)){e.preventDefault();alert('Fill in every date/time range, or remove the empty one.');return}
document.querySelector('#cameras-json').value=JSON.stringify(chosen);document.querySelector('#slots-json').value=JSON.stringify(slots)});</script>{{end}}
